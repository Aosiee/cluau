# Builds the translator, the converter, the runtime (Luau fetched by CMake) and
# the tool on macOS (Apple Clang) and runs the tests and the script tests, on every
# push.
name: macOS

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# The jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: clang }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # For the oldest macOS the releases support (release.yml), so that a
      # library call newer than that fails here.
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCLUAU_BUILD_TESTS=ON -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
