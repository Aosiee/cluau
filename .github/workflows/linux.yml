# Builds the translator, the converter, the runtime (Luau fetched by CMake) and
# the tool on Linux (GCC and Clang) and runs the tests and the script tests, on
# every push.
name: Linux

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# The jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gcc, cc: gcc, cxx: g++ }
          - { name: clang, cc: clang, cxx: clang++ }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCLUAU_BUILD_TESTS=ON -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Formatting
        if: matrix.name == 'gcc'
        run: build/cluau fmt --check src tests hamr.cluau

      - name: The editor grammar
        if: matrix.name == 'gcc'
        run: node editors/vscode/test/grammar.js
