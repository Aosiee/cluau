# A release for each version tag (vX.Y.Z): the command-line tool built and
# tested on Linux, macOS and Windows, packaged with the licence, the README,
# the syntax guide and the scripting guide, the installers tried against
# those packages on each platform, and all of it published as a GitHub
# release whose notes are the tag's message. A tag pushed from here on
# releases by itself; an existing tag (one made before this workflow) is
# released by running the workflow by hand with its name. A run by hand with
# `publish` off builds and tests everything (from `ref`, a branch, when
# given) and publishes nothing: a release's dry run.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to release (vX.Y.Z)'
        required: true
      ref:
        description: 'What to build, when not the tag (a branch, for a dry run)'
        required: false
        default: ''
      publish:
        description: 'Publish the release (off: build and test only)'
        type: boolean
        default: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  REF: ${{ inputs.ref || inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # Linux: built on glibc 2.28 (manylinux_2_28, AlmaLinux 8), so the
          # build runs on every system from RHEL 8, Debian 10 and Ubuntu 20.04 on.
          - { name: linux-x86_64, os: ubuntu-26.04, container: 'quay.io/pypa/manylinux_2_28_x86_64', exe: cluau, flags: '"-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"' }
          - { name: linux-arm64, os: ubuntu-26.04-arm, container: 'quay.io/pypa/manylinux_2_28_aarch64', exe: cluau, flags: '"-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"' }
          - { name: macos-arm64, os: macos-latest, exe: cluau, flags: '' }
          - { name: macos-x86_64, os: macos-15-intel, exe: cluau, flags: '' }
          - { name: windows-x86_64, os: windows-latest, exe: Release/cluau.exe, flags: '' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}

      # The build image's tools: CMake from its Python when it has none.
      - name: Build tools
        if: matrix.container
        run: |
          if ! command -v cmake > /dev/null; then
            /opt/python/cp312-cp312/bin/pip install --quiet cmake
            ln -sf /opt/python/cp312-cp312/bin/cmake /opt/python/cp312-cp312/bin/ctest /usr/local/bin/
          fi
          command -v python3 > /dev/null || ln -sf /opt/python/cp312-cp312/bin/python3 /usr/local/bin/python3
          cmake --version | sed -n 1p
          gcc --version | sed -n 1p
          ldd --version | sed -n 1p

      # The tag names the version the translator reports (Version()).
      - name: Check the tag against the version
        run: |
          version=$(sed -n 's/.*return "\([0-9][0-9.]*\)";.*/\1/p' src/translate/Translate.cpp | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "the tag is $TAG, but Version() says $version"
            exit 1
          fi

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCLUAU_BUILD_TESTS=ON ${{ matrix.flags }}
          cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        run: |
          dir="cluau-$TAG-${{ matrix.name }}"
          mkdir -p "$dir"
          cp "build/${{ matrix.exe }}" "$dir/"
          cp LICENSE README.md "$dir/"
          cp docs/syntax.md docs/scripting.md "$dir/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
          else
            tar -czf "$dir.tar.gz" "$dir"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: cluau-*.*z*

  # The Debian and RPM packages, from the Linux builds, each installed and run
  # on the oldest systems the builds support and on current ones.
  packages:
    name: packages (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: x86_64, os: ubuntu-26.04 }
          - { arch: arm64, os: ubuntu-26.04-arm }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}

      - uses: actions/download-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: dist

      - name: Build
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q rpm > /dev/null
          tar -xzf "dist/cluau-$TAG-linux-${{ matrix.arch }}.tar.gz"
          sh installer/packages.sh "$TAG" "cluau-$TAG-linux-${{ matrix.arch }}" packages

      - name: Installed and run
        run: |
          # A script that uses the bundled libraries (PCRE2, SQLite).
          mkdir -p probe
          printf '%s\n' 'print(require("@std/regex").compile("[0-9]+"):match("v42").text)' \
            'print(require("@std/sqlite").open(":memory:"):first("SELECT 6 * 7 AS n").n)' > probe/check.cluau
          check='cluau --version && cluau /probe/check.cluau'
          for image in debian:11 debian:12 ubuntu:22.04 ubuntu:26.04; do
            echo "== $image"
            docker run --rm -v "$PWD/packages:/packages" -v "$PWD/probe:/probe" "$image" sh -c "dpkg -i /packages/cluau_*.deb > /dev/null && $check && dpkg -r cluau > /dev/null && ! test -e /usr/bin/cluau"
          done
          # Not signed yet (Fedora and RHEL refuse an unsigned package unless told).
          for image in rockylinux:8 rockylinux:9 fedora:latest; do
            echo "== $image"
            docker run --rm -v "$PWD/packages:/packages" -v "$PWD/probe:/probe" "$image" sh -c "rpm -i --nosignature /packages/cluau-*.rpm && $check && rpm -e cluau && ! test -e /usr/bin/cluau"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.arch }}
          path: packages/*

  # The VS Code extension: its grammar's tests, then the extension in VS Code
  # (on a virtual display) against this release's Linux build, then packaged.
  vscode:
    name: VS Code extension
    needs: build
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist

      - name: Check the tag against the extension's version
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "v$version" != "$TAG" ]; then
            echo "the tag is $TAG, but editors/vscode/package.json says $version"
            exit 1
          fi

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Grammar
        run: node test/grammar.js

      - name: In VS Code
        run: |
          tar -xzf "../../dist/cluau-$TAG-linux-x86_64.tar.gz" -C "$RUNNER_TEMP"
          curl -fsSL -o "$RUNNER_TEMP/vscode.tar.gz" https://update.code.visualstudio.com/1.95.3/linux-x64/stable
          tar -xzf "$RUNNER_TEMP/vscode.tar.gz" -C "$RUNNER_TEMP"
          CLUAU_EDITOR_ARGS=--no-sandbox xvfb-run -a node test/editor/run.js "$RUNNER_TEMP/VSCode-linux-x64/code" "$RUNNER_TEMP/cluau-$TAG-linux-x86_64/cluau"

      - name: Package
        run: |
          cp ../../LICENSE .
          npx vsce package --out "../../cluau-vscode-$TAG.vsix"

      - uses: actions/upload-artifact@v4
        with:
          name: vscode
          path: cluau-vscode-*.vsix

  # The installers, run against this release's own downloads before they are
  # published: each installs, runs a script from PATH, and uninstalls.
  installers:
    name: installer (${{ matrix.os }})
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        shell: bash
        run: (cd dist && sha256sum * > SHA256SUMS 2>/dev/null || shasum -a 256 * > SHA256SUMS)

      - name: install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          CLUAU_DOWNLOAD_URL="$PWD/dist" CLUAU_VERSION="$TAG" sh installer/install.sh --prefix "$RUNNER_TEMP/cluau"
          printf '#!/usr/bin/env cluau\nprint("ran from", require("@std/process").platform)\n' > "$RUNNER_TEMP/hello.cluau"
          chmod +x "$RUNNER_TEMP/hello.cluau"
          (cd / && PATH="$RUNNER_TEMP/cluau/bin:$PATH" "$RUNNER_TEMP/hello.cluau")
          sh installer/install.sh --prefix "$RUNNER_TEMP/cluau" --uninstall
          test ! -e "$RUNNER_TEMP/cluau/bin/cluau"

      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:CLUAU_DOWNLOAD_URL = "$PWD\dist"
          $dir = Join-Path $env:RUNNER_TEMP 'cluau'
          ./installer/install.ps1 -Version $env:TAG -InstallDir $dir -AddToPathExt
          & (Join-Path $dir 'bin\cluau.exe') -e 'print("ran from", require("@std/process").platform)'
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not ([Environment]::GetEnvironmentVariable('Path', 'User') -split ';' | Where-Object { $_ -ieq (Join-Path $dir 'bin') })) { throw 'the user PATH has no cluau' }
          # A script on PATH, run by its name alone (PATHEXT and the association).
          $scripts = Join-Path $env:RUNNER_TEMP 'scripts'
          New-Item -ItemType Directory -Force $scripts | Out-Null
          $mark = Join-Path $env:RUNNER_TEMP 'ran-by-name.txt'
          Set-Content -Path (Join-Path $scripts 'hello.cluau') -Value "require(`"@std/fs`").write([[$mark]], `"yes`")"
          $env:Path = "$scripts;$(Join-Path $dir 'bin');$env:Path"
          $env:PATHEXT = [Environment]::GetEnvironmentVariable('PATHEXT', 'User')
          where.exe hello
          cmd /c hello
          if (-not (Test-Path $mark)) { throw 'hello did not run by its name' }
          ./installer/install.ps1 -InstallDir $dir -Uninstall
          if (Test-Path $dir) { throw 'the uninstall left the install directory' }
          if ([Environment]::GetEnvironmentVariable('PATHEXT', 'User') -match '\.CLUAU') { throw 'the uninstall left .CLUAU in PATHEXT' }

  release:
    needs: [build, packages, installers, vscode]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Notes from the tag
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          {
            git tag -l --format='%(contents)' "$TAG"
            echo
            echo "Install on Linux or macOS:"
            echo
            echo '```'
            echo "curl -fsSL https://github.com/Aosiee/cluau/releases/latest/download/install.sh | sh"
            echo '```'
            echo
            echo "Install on Windows (PowerShell):"
            echo
            echo '```'
            echo "irm https://github.com/Aosiee/cluau/releases/latest/download/install.ps1 | iex"
            echo '```'
            echo
            echo "Downloads: the \`cluau\` command line (run, check, test and profile scripts, the REPL, the language server, the debugger, translate, convert) for Linux (x86_64, arm64), macOS (arm64, x86_64) and Windows (x86_64), with the licence, the README, the syntax guide and the scripting guide; Debian and RPM packages for Linux (\`.deb\`, \`.rpm\`); the installers; and the VS Code extension (\`cluau-vscode-$TAG.vsix\`, also on the VS Code Marketplace and Open VSX). To embed the translator, build from source (no dependencies)."
          } > notes.md
          cp installer/install.sh installer/install.ps1 dist/
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="cluau ${TAG#v}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$title" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --title "$title" --notes-file notes.md --verify-tag
          fi

  # The extension on the VS Code Marketplace and Open VSX, once the release
  # is out. Each is published when its token is set (VSCE_PAT, OVSX_PAT).
  marketplaces:
    needs: release
    runs-on: ubuntu-26.04
    defaults:
      run:
        shell: bash
        working-directory: editors/vscode
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.REF }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          name: vscode
          path: dist

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: VS Code Marketplace
        if: env.VSCE_PAT != ''
        run: npx vsce publish --packagePath "../../dist/cluau-vscode-$TAG.vsix" --pat "$VSCE_PAT"

      - name: Open VSX
        if: env.OVSX_PAT != ''
        run: npx ovsx publish "../../dist/cluau-vscode-$TAG.vsix" --pat "$OVSX_PAT"
