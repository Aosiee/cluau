# A release for each version tag (vX.Y.Z): the command-line tool built and
# tested on Linux, macOS and Windows, packaged with the licence, the README
# and the syntax guide, and published as a GitHub release whose notes are
# the tag's message. A tag pushed from here on releases by itself; an
# existing tag (one made before this workflow) is released by running the
# workflow by hand with its name.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to release (vX.Y.Z)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x86_64, os: ubuntu-26.04, exe: cluau, tests: cluau_tests, flags: '"-DCMAKE_EXE_LINKER_FLAGS=-static-libstdc++ -static-libgcc"' }
          - { name: macos-arm64, os: macos-latest, exe: cluau, tests: cluau_tests, flags: '' }
          - { name: windows-x86_64, os: windows-latest, exe: Release/cluau.exe, tests: Release/cluau_tests.exe, flags: '' }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      # The tag names the version the translator reports (Version()).
      - name: Check the tag against the version
        run: |
          version=$(sed -n 's/.*return "\([0-9][0-9.]*\)";.*/\1/p' src/translate/Translate.cpp | head -1)
          if [ "v$version" != "$TAG" ]; then
            echo "the tag is $TAG, but Version() says $version"
            exit 1
          fi

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCLUAU_BUILD_TESTS=ON ${{ matrix.flags }}
          cmake --build build --config Release -j 4

      - name: Test
        run: build/${{ matrix.tests }}

      - name: Package
        run: |
          dir="cluau-$TAG-${{ matrix.name }}"
          mkdir -p "$dir"
          cp "build/${{ matrix.exe }}" "$dir/"
          cp LICENSE README.md "$dir/"
          cp docs/syntax.md "$dir/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a "$dir.zip" "$dir" > /dev/null
          else
            tar -czf "$dir.tar.gz" "$dir"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: cluau-*.*z*

  release:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Notes from the tag
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          {
            git tag -l --format='%(contents)' "$TAG"
            echo
            echo "Downloads: the \`cluau\` command line (translate, convert) for each platform, with the licence, the README and the syntax guide. To embed the translator, build from source (no dependencies)."
          } > notes.md
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="cluau ${TAG#v}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "$title" --notes-file notes.md
          else
            gh release create "$TAG" dist/* --title "$title" --notes-file notes.md --verify-tag
          fi
