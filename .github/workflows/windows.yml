# Builds the translator, the converter, the runtime (Luau fetched by CMake) and
# the tool on Windows (MSVC) and runs the tests and the script tests, on every
# push.
name: Windows

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# The jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: msvc }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Build
        run: |
          cmake -S . -B build -DCLUAU_BUILD_TESTS=ON
          cmake --build build --config Release -j 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
